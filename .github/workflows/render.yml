name: Render Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Render video
        run: npx remotion render MyComp out/video.mp4
        
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
